<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Xbox controller controls for FLL Robo Spartans</title>
  <desc id="desc">Annotated Xbox controller showing driving, recording, playback, speed, gyro, brake, and attachment controls.</desc>
  <rect width="1200" height="720" fill="#f4f1ea"/>
  <text x="600" y="54" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1d2935">FLL Robo Spartans controller map</text>
  <text x="600" y="84" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#52606d">XBoxControlledRecordingPlayback.py</text>

  <g transform="translate(285 140)">
    <path d="M190 105 C130 70 62 86 28 151 L0 291 C-8 337 43 361 73 325 L135 252 H465 L527 325 C557 361 608 337 600 291 L572 151 C538 86 470 70 410 105 C357 132 243 132 190 105Z" fill="#263746" stroke="#14232e" stroke-width="8"/>
    <path d="M191 115 C238 139 362 139 409 115" fill="none" stroke="#536575" stroke-width="5"/>
    <rect x="249" y="108" width="102" height="34" rx="17" fill="#a9b7c2"/>
    <circle cx="274" cy="125" r="8" fill="#263746"/>
    <circle cx="326" cy="125" r="8" fill="#263746"/>

    <circle cx="177" cy="205" r="31" fill="#172630" stroke="#a9b7c2" stroke-width="5"/>
    <circle cx="423" cy="205" r="31" fill="#172630" stroke="#a9b7c2" stroke-width="5"/>
    <text x="177" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f4f1ea">LEFT</text>
    <text x="423" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f4f1ea">RIGHT</text>

    <rect x="78" y="169" width="62" height="62" rx="8" fill="#172630"/>
    <rect x="101" y="146" width="16" height="108" rx="5" fill="#d7e0e5"/>
    <rect x="55" y="192" width="108" height="16" rx="5" fill="#d7e0e5"/>
    <text x="109" y="277" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f4f1ea">D-pad</text>

    <circle cx="485" cy="168" r="17" fill="#e35d5b"/><text x="485" y="174" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">Y</text>
    <circle cx="517" cy="200" r="17" fill="#4f9f68"/><text x="517" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">A</text>
    <circle cx="453" cy="200" r="17" fill="#e0b84f"/><text x="453" y="206" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">X</text>
    <circle cx="485" cy="232" r="17" fill="#4d83c2"/><text x="485" y="238" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="white">B</text>

    <rect x="106" y="88" width="65" height="18" rx="8" fill="#a9b7c2"/><rect x="429" y="88" width="65" height="18" rx="8" fill="#a9b7c2"/>
    <text x="138" y="79" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f4f1ea">LB</text><text x="462" y="79" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f4f1ea">RB</text>
    <text x="299" y="53" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f4f1ea">LT / RT</text>
  </g>

  <g font-family="sans-serif" font-size="18" fill="#1d2935">
    <rect x="32" y="450" width="350" height="218" rx="12" fill="#ffffff" stroke="#bdc8cf" stroke-width="2"/>
    <text x="54" y="482" font-size="21" font-weight="700">Drive and attachments</text>
    <text x="54" y="516">Left stick Y: drive speed</text>
    <text x="54" y="545">Right stick X: turn</text>
    <text x="54" y="574">RT / LT: attachment motors A / B</text>
    <text x="54" y="603">RB / LB: reverse attachment A / B</text>
    <text x="54" y="632">X: enable left-stick steering mix</text>

    <rect x="425" y="450" width="350" height="218" rx="12" fill="#ffffff" stroke="#bdc8cf" stroke-width="2"/>
    <text x="447" y="482" font-size="21" font-weight="700">Modes and speed</text>
    <text x="447" y="516">A: 2x speed multiplier</text>
    <text x="447" y="545">B: 0.4x speed multiplier</text>
    <text x="447" y="574">Y: brake and hold drive motors</text>
    <text x="447" y="603">D-pad right: toggle gyro correction</text>
    <text x="447" y="632">D-pad down: reset attachments</text>

    <rect x="818" y="450" width="350" height="218" rx="12" fill="#ffffff" stroke="#bdc8cf" stroke-width="2"/>
    <text x="840" y="482" font-size="21" font-weight="700">Recording</text>
    <text x="840" y="516">View: start or stop recording</text>
    <text x="840" y="545">Menu: play selected slot</text>
    <text x="840" y="574">Hub left / right: select slots 1-10</text>
    <text x="840" y="603">Hub Center: play selected slot</text>
    <text x="840" y="632">Hub display: selected slot / R / P</text>
  </g>
</svg>
